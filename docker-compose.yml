version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: linkvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkvault_user
      POSTGRES_PASSWORD: linkvault_password
      POSTGRES_DB: linkvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkvault_user -d linkvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO (Local S3 / Cloudflare R2 Storage Emulator)
  minio:
    image: minio/minio:latest
    container_name: linkvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 3. MinIO Bucket Initialization Helper
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin miniopassword;
      /usr/bin/mc mb localminio/linkvault-files || true;
      exit 0;
      "

  # 4. LinkVault Application
  app:
    build: .
    container_name: linkvault-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://linkvault_user:linkvault_password@postgres:5432/linkvault
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: miniopassword
      R2_BUCKET_NAME: linkvault-files
      R2_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
